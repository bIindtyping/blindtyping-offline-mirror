nguage\":{\"title\":\"langue\",\"description\":\"Définit la langue des leçons de pratique. Cela affecte l'ensemble de caractères et la génération de mots utilisés pendant la pratique.\"},\"keyboard-layout\":{\"title\":\"disposition du clavier\",\"description\":\"Cela ne fonctionnera que pour le mode de pratique\"},\"velocity-display-type\":{\"title\":\"type d'affichage de la vitesse\",\"description\":\"Définit comment la vitesse de dactylographie est affichée sur l'écran principal de pratique et dans les statistiques. CPS est Caractères Par Seconde, CPM est Caractères Par Minute, et WPM est Mots Par Minute, calculé comme CPM divisé par 5.\"},\"velocity-goal\":{\"title\":\"objectif de vitesse\",\"description\":\"Définit une vitesse de dactylographie cible que vous souhaitez atteindre lors de vos sessions de pratique.\"},\"daily-goal-type\":{\"title\":\"type d'objectif quotidien\",\"description\":\"Spécifie si votre objectif quotidien est basé sur le temps de dactylographie (en minutes) ou le nombre de sessions de pratique complétées.\"},\"daily-time-goal\":{\"title\":\"objectif de temps quotidien\",\"description\":\"Définit le nombre de minutes que vous visez à passer à taper chaque jour.\"},\"daily-practices-goal\":{\"title\":\"objectif de pratiques quotidiennes\",\"description\":\"Définit le nombre de sessions de pratique que vous visez à compléter chaque jour.\"}},\"main\":{\"notifications\":{\"new-opened-letter\":{\"title\":\"Félicitations ! Nouvelle touche déverrouillée\",\"description\":\"Elle n'est pas calibrée et sera incluse dans chaque mot\"},\"goal-completed\":{\"time\":\"Поздравляем! Вы достигли дневной цели по времени. Вы можете продолжать, но если цель слишком мала, вы можете увеличить её в настройках\",\"practices\":\"Поздравляем! Вы достигли дневной цели по практикам. Вы можете продолжать, но если цель слишком мала, вы можете увеличить её в настройках\"},\"all-keys-open\":\"Félicitations ! Vous avez ouvert toutes les clés. Si cela vous a paru trop facile ou si vous souhaitez augmenter votre vitesse, modifiez l’objectif de vitesse dans les paramètres.\"},\"panel\":{\"keys\":{\"tooltip\":{\"remaining-amount-to-open-letter\":\"Il faut réaliser {amount} exercices supplémentaires pour débloquer une nouvelle lettre\",\"has-problem-keys\":\"Pour débloquer une nouvelle lettre, tapez les touches problématiques avec une grande précision et une vitesse supérieure à l'objectif\"}},\"goal-progress\":{\"tooltip\":\"Votre progression vers votre objectif quotidien\",\"practices-help\":\"Nombre de sessions de pratique terminées aujourd'hui\",\"time-help\":\"Temps total passé à taper aujourd'hui (en minutes)\"},\"last-practice\":{\"speed\":\"Vitesse de la dernière pratique\",\"speed-shift\":\"Différence par rapport à la valeur moyenne\",\"accuracy\":\"Précision de la dernière pratique\",\"accuracy-shift\":\"Différence par rapport à la valeur moyenne\"},\"target-key\":{\"tooltip\":\"La touche sur laquelle vous êtes le plus faible, choisie selon vos résultats. Elle apparaîtra dans chaque mot généré.\"},\"no-practices\":\"Aucune session de pratique n'a encore été complétée\"}},\"onboarding\":{\"steps\":{\"intro-1\":{\"title\":\"Mode de pratique\",\"description\":\"Ce mode de pratique vous aidera à apprendre la dactylographie tactile, ce qui signifie taper par la mémoire musculaire sans utiliser votre vue pour trouver les touches. Cela peut améliorer votre vitesse de dactylographie et votre précision de manière significative.\u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eCeci est un court tutoriel qui expliquera comment cette application fonctionne.\"},\"intro-2\":{\"title\":\"Mode de pratique\",\"description\":\"Notre méthode d'enseignement est basée sur ces principes : Pas d'exercices répétitifs ennuyeux.\u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eContrairement à la plupart des autres tuteurs de dactylographie, cette application ne vous force pas à répéter les mêmes leçons peu intellectuelles comme 'fff jjj fjf jfj' encore et encore. C'est très ennuyeux et contribue très peu à votre apprentissage global.\u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eCette application utilise un algorithme informatique sophistiqué pour générer des leçons de dactylographie qui correspondent à votre niveau de compétence. Ces leçons consistent en des mots aléatoires générés à partir d'un sous-ensemble de l'alphabet complet des lettres. La taille du sous-ensemble et la fréquence des lettres individuelles sont contrôlées par l'algorithme, ce qui vous offre la meilleure expérience d'apprentissage.\"},\"intro-3\":{\"title\":\"Mode de pratique\",\"description\":\"Vous commencez avec un petit ensemble de touches ouvertes. L'application mesure la rapidité avec laquelle vous tapez chacune et élargit l'ensemble à mesure que vous vous améliorez. Les lettres plus difficiles apparaissent plus souvent pour que vous pratiquiez exactement ce dont vous avez besoin.\"},\"words\":{\"title\":\"Mots\",\"description\":\"Ceci est votre tableau de texte. Les leçons sont générées automatiquement à partir de l'ensemble de lettres ouvertes actuel. La plupart des mots sont artificiels mais suivent les règles phonétiques, donc ils regardent et sonnent naturellement.\"},\"daily-goal\":{\"title\":\"Objectif quotidien\",\"description\":\"Définissez un objectif quotidien basé sur le temps ou le nombre de sessions de pratique pour rester cohérent et motivé.\"},\"speed\":{\"title\":\"Vitesse\",\"description\":\"Votre vitesse de dactylographie est affichée en WPM, CPM ou CPS (caractères par minute). Plus c'est haut, mieux c'est. Vous pouvez changer les unités dans les paramètres (l'icône d'engrenage sur la droite).\"},\"accuracy\":{\"title\":\"Précision\",\"description\":\"La précision affiche le pourcentage de caractères tapés sans erreur. Plusieurs erreurs au même endroit comptent pour une.\"},\"keys\":{\"title\":\"Touches\",\"description\":\"Ce panneau affiche les clés de la langue sélectionnée, classées par
