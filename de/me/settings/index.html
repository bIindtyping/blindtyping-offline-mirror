t durch 5.\"},\"velocity-goal\":{\"title\":\"Geschwindigkeitsziel\",\"description\":\"Legt eine Zieltippgeschwindigkeit fest, die du in deinen Übungseinheiten erreichen möchtest.\"},\"daily-goal-type\":{\"title\":\"Tagesziel-Typ\",\"description\":\"Gibt an, ob dein tägliches Ziel auf der Tippzeit (in Minuten) oder der Anzahl der abgeschlossenen Übungseinheiten basiert.\"},\"daily-time-goal\":{\"title\":\"tägliches Zeitziel\",\"description\":\"Legt die Anzahl der Minuten fest, die du täglich mit dem Tippen verbringen möchtest.\"},\"daily-practices-goal\":{\"title\":\"tägliches Übungsziel\",\"description\":\"Legt die Anzahl der Übungseinheiten fest, die du täglich abschließen möchtest.\"}},\"onboarding\":{\"steps\":{\"intro-1\":{\"title\":\"Übungsmodus\",\"description\":\"Dieser Übungsmodus hilft dir, das Zehnfingerschreiben zu erlernen, also das Tippen über das Muskelgedächtnis, ohne mit den Augen die Tasten zu suchen. Das kann deine Tippgeschwindigkeit und Genauigkeit erheblich verbessern.\u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eDies ist ein kurzes Tutorial, das erklärt, wie diese Anwendung funktioniert.\"},\"intro-2\":{\"title\":\"Übungsmodus\",\"description\":\"Unsere Lehrmethode basiert auf diesen Prinzipien: Keine langweiligen, wiederholten Übungen.\u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eIm Gegensatz zu den meisten anderen Tipptrainern zwingt dich diese Anwendung nicht, dieselben anspruchslosen Lektionen wie 'fff jjj fjf jfj' immer wieder zu wiederholen. Das ist sehr lästig und trägt nur wenig zu deinem Gesamtlernen bei.\u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eDiese Anwendung verwendet einen ausgeklügelten Computeralgorithmus, um Tipplektionen zu generieren, die deinem Fähigkeitsniveau entsprechen. Diese Lektionen bestehen aus zufälligen Wörtern, die mit einem Teil des gesamten Buchstabenalphabets generiert werden. Die Größe dieser Teilmenge und die Häufigkeit einzelner Buchstaben werden vom Algorithmus gesteuert, der dir die beste Lernerfahrung bietet.\"},\"intro-3\":{\"title\":\"Übungsmodus\",\"description\":\"Du beginnst mit einer kleinen Menge freigeschalteter Tasten. Die App misst, wie schnell du jede tippst, und erweitert die Menge, wenn du dich verbesserst. Schwierigere Buchstaben erscheinen häufiger, damit du genau das übst, was du brauchst.\"},\"words\":{\"title\":\"Wörter\",\"description\":\"Das ist dein Texte-Board. Lektionen werden automatisch aus dem aktuell freigeschalteten Buchstabensatz generiert. Die meisten Wörter sind künstlich, folgen aber phonetischen Regeln, sodass sie natürlich aussehen und klingen.\"},\"daily-goal\":{\"title\":\"Tagesziel\",\"description\":\"Lege ein Tagesziel basierend auf Zeit oder Anzahl der Übungseinheiten fest, um konsequent und motiviert zu bleiben.\"},\"speed\":{\"title\":\"Geschwindigkeit\",\"description\":\"Deine Tippgeschwindigkeit wird in WPM, CPM oder CPS (Zeichen pro Minute) angezeigt. Höher ist besser. Du kannst die Einheiten in den Einstellungen ändern (das Zahnradsymbol rechts).\"},\"accuracy\":{\"title\":\"Genauigkeit\",\"description\":\"Die Genauigkeit zeigt den Prozentsatz der ohne Fehler getippten Zeichen an. Mehrere Fehler an derselben Stelle zählen als einer.\"},\"keys\":{\"title\":\"Tasten\",\"description\":\"Dieses Panel zeigt die Tasten deiner gewählten Sprache, geordnet nach phonetischer Häufigkeit. Die freigeschalteten werden basierend auf deiner Leistung hervorgehoben.\u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eNeue werden freigeschaltet, wenn alle Tasten mindestens 5 Proben (abgeschlossene Tests) haben und alle zu 100% korrekt sind\"},\"target-key\":{\"title\":\"Zieltaste\",\"description\":\"Dieser Indikator zeigt deine schwächste Taste, ausgewählt basierend auf deiner Leistung. Diese Taste erscheint in jedem generierten Wort\"},\"outro\":{\"title\":\"Du bist bereit!\",\"description\":\"Du hast das Tutorial abgeschlossen. Beginne mit dem Üben und verfolge deinen Fortschritt.\"}}}},\"leader
